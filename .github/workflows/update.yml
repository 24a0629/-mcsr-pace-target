name: update-data
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
concurrency: {group: update, cancel-in-progress: false}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4          # 蓄積データ(data ブランチ)。初回は無いので失敗してOK
        continue-on-error: true
        with: {ref: data, path: data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collect.py fetch --minutes 40 && python collect.py build --days 14
      - name: save data branch (1コミットに上書き=履歴が増えない)
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add recent.jsonl state.json archive
          git commit -q -m "data $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - run: mkdir -p _site/data && cp index.html _site/ && cp data/finishers.json data/meta.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: dep
        uses: actions/deploy-pages@v4
